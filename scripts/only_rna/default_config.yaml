qc:
  method: dynamic_hybrid_mad
  counts_lower_nmads: 2.5
  genes_lower_nmads: 2.5
  pct_mt_upper_nmads: 2.5
  pct_ribo_upper_nmads: 3.5
  min_cells_for_dynamic: 50
  count_floor_min: 100
  count_floor_max: 1500
  gene_floor_min: 100
  gene_floor_max: 1200
  pct_mt_ceiling_min: 5.0
  pct_mt_ceiling_max: 40.0
  pct_ribo_ceiling_min: 20.0
  pct_ribo_ceiling_max: 80.0
plotting:
  umap_width: 10.0
  umap_height: 8.0
  dpi: 180
  point_size: 3.0
  legend_fontsize: 10.0
  legend_title_fontsize: 11.0
annotation:
  methods:
    - azimuth
azimuth:
  enabled: true
  reference: pbmcref
  annotation_levels:
    - l1
    - l2
tuning:
  qc_preset_family: baseline_only
  azimuth_preset_family: baseline_only
  embedding_preset_family: baseline_only
  max_candidates: 1
