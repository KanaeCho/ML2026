[project]
name = "ml2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "anndata>=0.8.0",
    "bbknn>=1.6.0",
    "datasets>=4.7.0",
    "geoparse>=2.0.4",
    "h5py>=3.16.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "protobuf>=7.34.0",
    "pyranges>=0.1.4",
    "pyyaml>=6.0",
    "scanpy>=1.9.0",
    "pyside6>=6.10.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "sentencepiece>=0.2.1",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "umap-learn>=0.5.0",
    "igraph>=1.0.0",
    "leidenalg>=0.11.0",
    "basedpyright>=1.39.2",
    "harmonypy>=2.0.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
